<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Alpino;src:url(../public/fonts/alpino-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:Alpino;src:url(../public/fonts/alpino-500.woff2) format("woff2");font-weight:500}
@font-face{font-family:"IBM Plex Mono";src:url(../public/fonts/plex-mono-500.woff2) format("woff2");font-weight:500}
html,body{margin:0}
body{width:1200px;height:630px;background:#eef1f4;color:#101820;font-family:Alpino,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:72px 84px;box-sizing:border-box}
.top{font-size:28px;font-weight:500;color:#5c6670}
.name{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:168px;line-height:1;letter-spacing:-0.02em}
.caret{display:inline-block;width:0.08em;height:0.85em;margin-left:0.06em;vertical-align:-0.06em;background:#1f3fbf}
.tag{font-size:40px;line-height:1.3;max-width:900px;margin-top:28px}
.bottom{font-family:"IBM Plex Mono",monospace;font-size:26px;color:#5c6670}
</style></head><body>
<div class="top">a name generator</div>
<div><div class="name">blither<span class="caret"></span></div>
<div class="tag">Names for your next CLI, app or startup, from a tiny character model that runs in your browser.</div></div>
<div class="bottom">blither.vercel.app</div>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Names for your next CLI, app or startup, from a tiny character model that runs in your browser." />
    <meta property="og:title" content="blither" />
    <meta property="og:description" content="Names for your next CLI, app or startup, from a tiny character model that runs in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blither.vercel.app/" />
    <meta property="og:image" content="https://blither.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>blither</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/alpino-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // set the theme before first paint so there is no flash
      try {
        var prefs = JSON.parse(localStorage.getItem("blither.prefs") || "{}");
        var theme = prefs.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
